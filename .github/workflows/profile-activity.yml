name: Refresh profile activity

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/render-activity.mjs
      - tools/render-commit-counter.mjs
      - .github/workflows/profile-activity.yml

concurrency:
  group: profile-activity
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and publish the activity strip
        run: node tools/render-activity.mjs --publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
