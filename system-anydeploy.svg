nt-size="14" fill="#94a8c2" class="mono" letter-spacing=".8" >EXAMPLE / REPOSITORY → LOCAL STATIC SITE</text><text x="18" y="405" font-size="16" fill="#c5ff5c" class="mono" letter-spacing=".8" >01 / CHOOSE THE SOURCE AND TARGET</text></g><g class="state state-1" data-state="1" aria-label="Build on the chosen device"><text x="30" y="87" font-size="17" fill="#c5ff5c" class="mono" letter-spacing=".8" >BUILD ON TARGET</text><rect x="29" y="110" width="291" height="44" rx="7" fill="#122539" stroke="#263b53"/><text x="42" y="138" font-size="16" fill="#f3f7ff" class="mono" letter-spacing=".8" >DETECT PROJECT</text><rect x="29" y="169" width="291" height="44" rx="7" fill="#122539" stroke="#263b53"/><text x="42" y="197" font-size="16" fill="#f3f7ff" class="mono" letter-spacing=".8" >INSTALL DEPENDENCIES</text><rect x="29" y="228" width="291" height="44" rx="7" fill="#122539" stroke="#c5ff5c"/><text x="42" y="256" font-size="16" fill="#c5ff5c" class="mono" letter-spacing=".8" >BUILD OUTPUT</text><text x="29" y="315" font-size="14" fill="#94a8c2" class="mono" letter-spacing=".8" >Source is processed on the device.</text><text x="429" y="168" font-size="15" fill="#54d9ff" class="mono" letter-spacing=".8" >> detect</text><text x="429" y="204" font-size="15" fill="#54d9ff" class="mono" letter-spacing=".8" >> install</text><text x="429" y="240" font-size="15" fill="#c5ff5c" class="mono" letter-spacing=".8" >> build</text><text x="26" y="375" font-size="14" fill="#94a8c2" class="mono" letter-spacing=".8" >EXAMPLE / REPOSITORY → LOCAL STATIC SITE</text><text x="18" y="405" font-size="16" fill="#c5ff5c" class="mono" letter-spacing=".8" >02 / BUILD ON THE CHOSEN DEVICE</text></g><g class="state state-2" data-state="2" aria-label="Serve for the project type"><text x="30" y="87" font-size="17" fill="#c5ff5c" class="mono" letter-spacing=".8" >SERVE BY PROJECT TYPE</text><text x="29" y="114" font-size="12" fill="#94a8c2" class="mono" letter-spacing=".8" >CONDITIONAL RUNTIME PATHS</text><r