 >CUSTOM DOMAIN</text><text x="29" y="310" font-size="14" fill="#94a8c2" class="mono" letter-spacing=".8" >Mode controls reachability.</text><text x="487" y="174" font-size="26" fill="#c5ff5c" class="mono" letter-spacing=".8" text-anchor="middle">LAN</text><text x="487" y="211" font-size="19" fill="#f3f7ff" class="mono" letter-spacing=".8" text-anchor="middle">READY</text><path d="M477 253l6 6 12-15" fill="none" stroke="#c5ff5c" stroke-width="2" /><text x="26" y="375" font-size="14" fill="#94a8c2" class="mono" letter-spacing=".8" >EXAMPLE / REPOSITORY → LOCAL STATIC SITE</text><text x="18" y="405" font-size="16" fill="#c5ff5c" class="mono" letter-spacing=".8" >04 / CHOOSE HOW TO REACH IT</text></g></g><text x="842" y="677" font-size="17" fill="#c5ff5c" class="mono" letter-spacing="1.4" >APP FLOW / SOURCE → TARGET → BUILD → ROUTE</text><rect x="46" y="740" width="320" height="42" rx="21" fill="#101823" stroke="#c5ff5c"/><text x="206" y="768" font-size="17" fill="#c5ff5c" class="mono" letter-spacing="1.4" text-anchor="middle">ANDROID / TERMUX</text><rect x="386" y="740" width="320" height="42" rx="21" fill="#101823" stroke="#9baac1"/><text x="546" y="768" font-size="17" fill="#9baac1" class="mono" letter-spacing="1.4" text-anchor="middle">RASPBERRY PI</text><rect x="726" y="740" width="320" height="42" rx="21" fill="#101823" stroke="#c5ff5c"/><text x="886" y="768" font-size="17" fill="#c5ff5c" class="mono" letter-spacing="1.4" text-anchor="middle">LINUX</text><rect x="1066" y="740" width="320" height="42" rx="21" fill="#101823" stroke="#9baac1"/><text x="1226" y="768" font-size="17" fill="#9baac1" class="mono" letter-spacing="1.4" text-anchor="middle">WINDOWS / WSL2</text><text x="1398" y="798" font-size="17" fill="#c5ff5c" class="mono" letter-spacing="1.4" text-anchor="end">OPEN PROJECT / RELEASES ↗</text></g><rect x="1" y="1" width="1438" height="818" rx="28" fill="none" stroke="url(#border)" stroke-width="2"/></svg>
