<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">Orbs. Desktop automation built around changing state.</title><desc id="desc">Release and activity values are dated public GitHub snapshots. Animated project scenes are labelled example walkthroughs with coordinated input, processing and output states; they are not live application telemetry.</desc><defs><linearGradient id="border"><stop stop-color="#53617d"/><stop offset=".5" stop-color="#152239"/><stop offset="1" stop-color="#54d9ff" stop-opacity=".55"/></linearGradient><radialGradient id="halo"><stop stop-color="#54d9ff" stop-opacity=".18"/><stop offset="1" stop-color="#54d9ff" stop-opacity="0"/></radialGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#314d69"/><stop offset=".5" stop-color="#182b40"/><stop offset="1" stop-color="#0c1523"/></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#19394a" stop-opacity=".8"/><stop offset="1" stop-color="#0a1728" stop-opacity=".95"/></linearGradient><radialGradient id="board-glow"><stop stop-color="#54d9ff" stop-opacity=".13"/><stop offset="1" stop-color="#54d9ff" stop-opacity="0"/></radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#273950" stroke-opacity=".28"/></pattern><clipPath id="clip"><rect x="2" y="2" width="1436" height="816" rx="28"/></clipPath></defs><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"Cascadia Code",Consolas,monospace}.state-0{animation:s0 16s steps(1,end) infinite}@keyframes s0{0%{opacity:1}0%{opacity:1}24.99%{opacity:1}25%,100%{opacity:0}}.state-1{animation:s1 16s steps(1,end) infinite}@keyframes s1{0%,24.99%{opacity:0}25%{opacity:1}49.99%{opacity:1}50%,100%{opacity:0}}.state-2{animation:s2 16s steps(1,end) infinite}@keyframes s2{0%,49.99%{opacity:0}50%{opacity:1}74.99%{opacity:1}75%,100%{opacity:0}}.state-3{animation:s3 16s steps(1,end) infinite}@keyframes s3{0%,74.99%{opacity:0}75%{opacity:1}99.99%{opacity:1}100%,100%{opacity:0}}.state{opacity:0}.state.final{opacity:1}@media(prefers-reduced-motion:reduce){.state{animation:none!important;opacity:0!important}.state.final{opacity:1!important}}</style><g clip-path="url(#clip)"><rect width="1440" height="820" fill="#05070d"/><rect width="1440" height="820" fill="url(#grid)"/><text x="42" y="51" font-size="19" fill="#54d9ff" class="mono" letter-spacing="1.4" >02 / PUBLIC RELEASE</text><text x="1398" y="51" font-size="19" fill="#9baac1" class="mono" letter-spacing="1.4" text-anchor="end">JPEG111</text><path d="M42 78H1398" fill="none" stroke="#243143" stroke-width="2" /><text x="42" y="222" font-size="136" fill="#54d9ff" font-weight="800" letter-spacing="-4">Orbs</text><text x="46" y="311" font-size="34" fill="#9baac1" >Desktop automation built around changing state.</text><text x="48" y="365" font-size="19" fill="#54d9ff" class="mono" letter-spacing="1.4" >OBSERVE</text><text x="208" y="365" font-size="28" fill="#f3f7ff" >Client state / quest queue</text><text x="48" y="430" font-size="19" fill="#54d9ff" class="mono" letter-spacing="1.4" >RECOVER</text><text x="208" y="430" font-size="28" fill="#f3f7ff" >Bounded retries / deadlines</text><text x="48" y="495" font-size="19" fill="#54d9ff" class="mono" letter-spacing="1.4" >PRESERVE</text><text x="208" y="495" font-size="28" fill="#f3f7ff" >Queues / preferences / updates</text><rect x="46" y="565" width="680" height="137" rx="14" fill="#090e17" stroke="#243143"/><text x="67" y="597" font-size="16" fill="#9baac1" class="mono" letter-spacing="1.4" >PUBLIC RELEASE / 2026-11-12</text><text x="67" y="643" font-size="38" fill="#54d9ff" font-weight="750">v1.21.16</text><text x="67" y="678" font-size="18" fill="#9baac1" class="mono" letter-spacing="1.4" >1 RELEASE FILES / 2026-11-02</text><g transform="translate(820 200) scale(0.9666666666666667 1.0465116279069768)"