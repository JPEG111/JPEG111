<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">InstaVault. A searchable local library from scattered media.</title><desc id="desc">Original dark artwork for Skandar / JPEG111. Workflow illustrations, not a live application or telemetry.</desc><defs><linearGradient id="border"><stop stop-color="#53617d"/><stop offset=".5" stop-color="#152239"/><stop offset="1" stop-color="#54d9ff" stop-opacity=".55"/></linearGradient><radialGradient id="halo"><stop stop-color="#54d9ff" stop-opacity=".18"/><stop offset="1" stop-color="#54d9ff" stop-opacity="0"/></radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#273950" stroke-opacity=".28"/></pattern><clipPath id="clip"><rect x="2" y="2" width="1436" height="816" rx="28"/></clipPath></defs><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"Cascadia Code",Consolas,monospace}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 36s linear infinite}.reverse{animation-direction:reverse;animation-duration:54s}.signal{stroke-dasharray:8 22;animation:signal 7s linear infinite}.pulse{animation:pulse 3.6s ease-in-out infinite}.delay{animation-delay:1.2s}.scan{animation:scan 7s ease-in-out infinite}.line1{animation:lines 9s ease-in-out infinite}.line2{animation:lines 9s 1s ease-in-out infinite}.line3{animation:lines 9s 2s ease-in-out infinite}.float{animation:float 7s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes signal{to{stroke-dashoffset:-360}}@keyframes pulse{50%{opacity:.28}}@keyframes scan{0%,100%{transform:translateX(-55px);opacity:.2}50%{transform:translateX(55px);opacity:.8}}@keyframes lines{0%,100%{opacity:.3}25%,75%{opacity:1}}@keyframes float{50%{transform:translateY(-10px)}}@media(prefers-reduced-motion:reduce){.orbit,.signal,.pulse,.scan,.line1,.line2,.line3,.float{animation:none!important}}</style><g clip-path="url(#clip)"><rect width="1440" height="820" fill="#05070d"/><rect width="1440" height="820" fill="url(#grid)"/><text x="42" y="51" font-size="19" fill="#54d9ff" class="mono" letter-spacing="1.4" >03 / RELEASED SOFTWARE</text><text x="1398" y="51" font-size="19" fill="#9baac1" class="mono" letter-spacing="1.4" text-anchor="end">JPEG111</text><path d="M42 78H1398" fill="none" stroke="#243143" stroke-width="2" /><text x="42" y="222" font-size="136" fill="#9780ff" font-weight="800" letter-spacing="-4">InstaVault</text><text x="46" y="311" font-size="34" fill="#9baac1" >A searchable local library from scattered media.</text><text x="48" y="365" font-size="19" fill="#9780ff" class="mono" letter-spacing="1.4" >INGEST</text><text x="208" y="365" font-size="28" fill="#f3f7ff" >Saved posts / shared media</text><text x="48" y="430" font-size="19" fill="#9780ff" class="mono" letter-spacing="1.4" >ENRICH</text><text x="208" y="430" font-size="28" fill="#f3f7ff" >Local AI / OCR / embeddings</text><text x="48" y="495" font-size="19" fill="#9780ff" class="mono" letter-spacing="1.4" >EXPLORE</text><text x="208" y="495" font-size="28" fill="#f3f7ff" >Graph / fuzzy + semantic search</text><rect x="46" y="565" width="680" height="137" rx="14" fill="#090e17" stroke="#243143"/><text x="67" y="597" font-size="14" fill="#9baac1" class="mono" letter-spacing="1.4" >ILLUSTRATED WORKFLOW</text><text x="70" y="632" font-size="20" fill="#9780ff" class="mono line1" letter-spacing="1.4" >media → text → embeddings</text><text x="70" y="658" font-size="20" fill="#9baac1" class="mono line2" letter-spacing="1.4" >AI enrichment stays optional</text><text x="70" y="684" font-size="20" fill="#9baac1" class="mono line3" letter-spacing="1.4" >transcription in its own process</text><rect x="865" y="332" width="475" height="62" rx="12" fill="#101a29" stroke="#243143"/><circle cx="889" cy="363" r="4" fill="#9780ff" class="pulse "/><text x="913" y="371" font-size="22" fill="#f3f7ff" class="mono" letter-spacing="1.4" >IMPORT MEDIA</text><path d="M1102.5 394V420" fill="none" stroke="#9780ff" stroke-width="2" class="signal"/><rect x="865" y="420" width="475" height="62" rx="12" fill="#101a29" stroke="#243143"/><circle cx="889" cy="451" r="4" fill="#9780ff" class="pulse delay"/><text x="913" y="459" font-size="22" fill="#f3f7ff" class="mono" letter-spacing="1.4" >EXTRACT / ENRICH</text><path d="M1102.5 482V508" fill="none" stroke="#9780ff" stroke-width="2" class="signal"/><rect x="865" y="508" width="475" height="62" rx="12" fill="#101a29" stroke="#243143"/><circle cx="889" cy="539" r="4" fill="#9780ff" class="pulse "/><text x="913" y="547" font-size="22" fill="#f3f7ff" class="mono" letter-spacing="1.4" >LINK / INDEX</text><path d="M1102.5 570V596" fill="none" stroke="#9780ff" stroke-width="2" class="signal"/><rect x="865" y="596" width="475" height="62" rx="12" fill="#101a29" stroke="#9780ff"/><circle cx="889" cy="627" r="4" fill="#9780ff" class="pulse delay"/><text x="913" y="635" font-size="22" fill="#9780ff" class="mono" letter-spacing="1.4" >SEARCH / EXPLORE</text><rect x="46" y="740" width="320" height="42" rx="21" fill="#101823" stroke="#9780ff"/><text x="206" y="768" font-size="17" fill="#9780ff" class="mono" letter-spacing="1.4" text-anchor="middle">ELECTRON / REACT</text><rect x="386" y="740" width="320" height="42" rx="21" fill="#101823" stroke="#9baac1"/><text x="546" y="768" font-size="17" fill="#9baac1" class="mono" letter-spacing="1.4" text-anchor="middle">FASTAPI</text><rect x="726" y="740" width="320" height="42" rx="21" fill="#101823" stroke="#9780ff"/><text x="886" y="768" font-size="17" fill="#9780ff" class="mono" letter-spacing="1.4" text-anchor="middle">LOCAL OLLAMA</text><rect x="1066" y="740" width="320" height="42" rx="21" fill="#101823" stroke="#9baac1"/><text x="1226" y="768" font-size="17" fill="#9baac1" class="mono" letter-spacing="1.4" text-anchor="middle">OPTIONAL PACKS</text><text x="1398" y="798" font-size="17" fill="#9780ff" class="mono" letter-spacing="1.4" text-anchor="end">OPEN PROJECT / RELEASES ↗</text></g><rect x="1" y="1" width="1438" height="818" rx="28" fill="none" stroke="url(#border)" stroke-width="2"/></svg>
