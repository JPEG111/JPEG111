<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="240" viewBox="0 0 1440 240" role="img" aria-labelledby="title desc"><title id="title">NEXT TO SHIP. SETUP / RECOVERY / RELEASES</title><desc id="desc">Release and activity values are dated public GitHub snapshots. Animated project scenes are labelled example walkthroughs with coordinated input, processing and output states; they are not live application telemetry.</desc><defs><linearGradient id="border"><stop stop-color="#53617d"/><stop offset=".5" stop-color="#152239"/><stop offset="1" stop-color="#54d9ff" stop-opacity=".55"/></linearGradient><radialGradient id="halo"><stop stop-color="#54d9ff" stop-opacity=".18"/><stop offset="1" stop-color="#54d9ff" stop-opacity="0"/></radialGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#314d69"/><stop offset=".5" stop-color="#182b40"/><stop offset="1" stop-color="#0c1523"/></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#19394a" stop-opacity=".8"/><stop offset="1" stop-color="#0a1728" stop-opacity=".95"/></linearGradient><radialGradient id="board-glow"><stop stop-color="#54d9ff" stop-opacity=".13"/><stop offset="1" stop-color="#54d9ff" stop-opacity="0"/></radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#273950" stroke-opacity=".28"/></pattern><clipPath id="clip"><rect x="2" y="2" width="1436" height="236" rx="28"/></clipPath></defs><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"Cascadia Code",Consolas,monospace}.state-0{animation:s0 16s steps(1,end) infinite}@keyframes s0{0%{opacity:1}0%{opacity:1}24.99%{opacity:1}25%,100%{opacity:0}}.state-1{animation:s1 16s steps(1,end) infinite}@keyframes s1{0%,24.99%{opacity:0}25%{opacity:1}49.99%{opacity:1}50%,100%{opacity:0}}.state-2{animation:s2 16s steps(1,end) infinite}@keyframes s2{0%,49.99%{opacity:0}50%{opacity:1}74.99%{opacity:1}75%,100%{opacity:0}}.state-3{animation:s3 16s steps(1,end) infinite}@keyframes s3{0%,74.99%{opacity:0}75%{opacity:1}99.99%{opacity:1}100%,100%{opacity:0}}.state{opacity:0}.state.final{opacity:1}@media(prefers-reduced-motion:reduce){.state{animation:none!important;opacity:0!important}.state.final{opacity:1!important}}</style><g clip-path="url(#clip)"><rect width="1440" height="240" fill="#05070d"/><rect width="1440" height="240" fill="url(#grid)"/><text x="42" y="48" font-size="19" fill="#c5ff5c" class="mono" letter-spacing="1.4" >08 / JPEG111</text><text x="42" y="145" font-size="76" fill="#f3f7ff" font-weight="800" letter-spacing="-2">NEXT TO SHIP</text><text x="46" y="196" font-size="24" fill="#c5ff5c" class="mono" letter-spacing="1.4" >SETUP / RECOVERY / RELEASES</text><text x="1055" y="68" font-size="14" fill="#94a8c2" class="mono" letter-spacing=".8" >NEXT ENGINEERING WORK</text><text x="1055" y="103" font-size="17" fill="#c5ff5c" class="mono" letter-spacing=".8" >SETUP → RECOVERY → RELEASE</text><text x="1055" y="135" font-size="12" fill="#94a8c2" class="mono" letter-spacing=".8" >GOALS / NOT COMPLETION METRICS</text></g><rect x="1" y="1" width="1438" height="238" rx="28" fill="none" stroke="url(#border)" stroke-width="2"/></svg>
