<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1100" viewBox="0 0 720 1100" role="img" aria-labelledby="title desc"><title id="title">Luminal. Camera controls meet multi-step image generation.</title><desc id="desc">Original dark artwork for Skandar / JPEG111. Workflow illustrations, not a live application or telemetry.</desc><defs><linearGradient id="border"><stop stop-color="#53617d"/><stop offset=".5" stop-color="#152239"/><stop offset="1" stop-color="#54d9ff" stop-opacity=".55"/></linearGradient><radialGradient id="halo"><stop stop-color="#54d9ff" stop-opacity=".18"/><stop offset="1" stop-color="#54d9ff" stop-opacity="0"/></radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#273950" stroke-opacity=".28"/></pattern><clipPath id="clip"><rect x="2" y="2" width="716" height="1096" rx="28"/></clipPath></defs><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"Cascadia Code",Consolas,monospace}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 36s linear infinite}.reverse{animation-direction:reverse;animation-duration:54s}.signal{stroke-dasharray:8 22;animation:signal 7s linear infinite}.pulse{animation:pulse 3.6s ease-in-out infinite}.delay{animation-delay:1.2s}.scan{animation:scan 7s ease-in-out infinite}.line1{animation:lines 9s ease-in-out infinite}.line2{animation:lines 9s 1s ease-in-out infinite}.line3{animation:lines 9s 2s ease-in-out infinite}.float{animation:float 7s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes signal{to{stroke-dashoffset:-360}}@keyframes pulse{50%{opacity:.28}}@keyframes scan{0%,100%{transform:translateX(-55px);opacity:.2}50%{transform:translateX(55px);opacity:.8}}@keyframes lines{0%,100%{opacity:.3}25%,75%{opacity:1}}@keyframes float{50%{transform:translateY(-10px)}}@media(prefers-reduced-motion:reduce){.orbit,.signal,.pulse,.scan,.line1,.line2,.line3,.float{animation:none!important}}</style><g clip-path="url(#clip)"><rect width="720" height="1100" fill="#05070d"/><rect width="720" height="1100" fill="url(#grid)"/><text x="42" y="51" font-size="19" fill="#54d9ff" class="mono" letter-spacing="1.4" >06 / LOCAL BUILD / LAB</text><text x="678" y="51" font-size="19" fill="#9baac1" class="mono" letter-spacing="1.4" text-anchor="end">JPEG111</text><path d="M42 78H678" fill="none" stroke="#243143" stroke-width="2" /><text x="42" y="180" font-size="104" fill="#9780ff" font-weight="800" letter-spacing="-4">Luminal</text><text x="46" y="248" font-size="31" fill="#9baac1" >Camera controls meet</text><text x="46" y="293" font-size="31" fill="#9baac1" >multi-step image generation.</text><text x="48" y="401" font-size="19" fill="#9780ff" class="mono" letter-spacing="1.4" >POSE</text><text x="48" y="437" font-size="27" fill="#f3f7ff" >Named camera angles / orbit UI</text><text x="48" y="480" font-size="19" fill="#9780ff" class="mono" letter-spacing="1.4" >ROUTE</text><text x="48" y="516" font-size="27" fill="#f3f7ff" >Single-shot or six-stage pipeline</text><text x="48" y="559" font-size="19" fill="#9780ff" class="mono" letter-spacing="1.4" >CACHE</text><text x="48" y="595" font-size="27" fill="#f3f7ff" >Reuse source and subject analysis</text><rect x="42" y="682" width="636" height="340" rx="20" fill="#09111e" stroke="#243143"/><g class="orbit"><circle cx="360" cy="830" r="110" fill="none" stroke="#9780ff" stroke-dasharray="3 14"/><circle cx="470" cy="830" r="4" fill="#9780ff" /><circle cx="455.2627944162883" cy="885" r="4" fill="#9780ff" /><circle cx="415" cy="925.2627944162882" r="4" fill="#9780ff" /><circle cx="360" cy="940" r="8" fill="#c5ff5c" /><circle cx="305" cy="925.2627944162882" r="4" fill="#9780ff" /><circle cx="264.7372055837117" cy="885" r="4" fill="#9780ff" /><circle cx="250" cy="830" r="4" fill="#9780ff" /><circle cx="264.7372055837117" cy="775" r="4" fill="#9780ff" /><circle cx="304.99999999999994" cy="734.7372055837118" r="4" fill="#9780ff" /><circle cx="360" cy="720" r="4" fill="#9780ff" /><circle cx="415" cy="734.7372055837118" r="4" fill="#9780ff" /><circle cx="455.2627944162882" cy="775" r="4" fill="#9780ff" /></g><ellipse cx="360" cy="830" rx="110" ry="46.199999999999996" fill="none" stroke="#243143"/><path d="M360 720V940" fill="none" stroke="#243143" stroke-width="2" /><text x="360" y="839" font-size="26" fill="#f3f7ff" text-anchor="middle" class="mono">CAMERA</text><text x="66" y="982" font-size="22" fill="#9780ff" class="mono" letter-spacing="1.4" >SOURCE → SUBJECT → SCENE</text><path d="M42 1058H678" fill="none" stroke="#243143" stroke-width="2" /><text x="42" y="1085" font-size="17" fill="#9baac1" class="mono" letter-spacing="1.4" >ARCHITECTURE STUDY / IMPLEMENTED SOURCE</text></g><rect x="1" y="1" width="718" height="1098" rx="28" fill="none" stroke="url(#border)" stroke-width="2"/></svg>
