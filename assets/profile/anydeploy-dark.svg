<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="258" viewBox="0 0 1280 258" role="img" aria-labelledby="t d"><title id="t">anyDeploy — Self-hosted deployment</title><desc id="d">Original artwork for JPEG111's GitHub README. Moving signals are decorative.</desc><style>text{font-family:'Segoe UI',Arial,sans-serif}.signal{stroke-dasharray:4 15;animation:signal 16s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}@keyframes signal{to{stroke-dashoffset:-380}}@keyframes pulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.signal,.pulse{animation:none}}</style><rect width="1280" height="258" fill="#0b1420"/><path d="M0 24 V0 H1256 L1280 24 V258 H24 L0 234 Z" fill="none" stroke="#314652" stroke-width="2" /><text x="34" y="39" fill="#c9fc78" font-size="16" font-family="ui-monospace,Consolas,monospace" letter-spacing="1.5" >01 / SPARE HARDWARE. ANOTHER LIFE.</text><text x="34" y="106" fill="#ecf2ec" font-size="57" font-weight="650" letter-spacing="-1.5">anyDeploy</text><text x="36" y="149" fill="#a5b6bf" font-size="24" >Self-hosted deployment</text><path d="M793 128 H1147" fill="none" stroke="#314652" stroke-width="2" /><path d="M793 128 H1147" fill="none" stroke="#c9fc78" stroke-width="2" class="signal"/><rect x="742" y="101" width="102" height="54" rx="3" fill="#112330" stroke="#314652" /><text x="793" y="134" fill="#ecf2ec" font-size="14" font-family="ui-monospace,Consolas,monospace" letter-spacing="1.5" text-anchor="middle">REPO</text><rect x="919" y="101" width="102" height="54" rx="3" fill="#112330" stroke="#314652" /><text x="970" y="134" fill="#ecf2ec" font-size="14" font-family="ui-monospace,Consolas,monospace" letter-spacing="1.5" text-anchor="middle">DEPLOY</text><rect x="1096" y="101" width="102" height="54" rx="3" fill="#112330" stroke="#314652" /><text x="1147" y="134" fill="#c9fc78" font-size="13" font-family="ui-monospace,Consolas,monospace" letter-spacing="1.5" text-anchor="middle">HARDWARE</text><path d="M1147 167 V189 H793