<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-labelledby="t d"><title id="t">anyDeploy — Self-hosted deployment</title><desc id="d">Original artwork for JPEG111's GitHub README. Moving signals are decorative.</desc><style>text{font-family:'Segoe UI',Arial,sans-serif}.signal{stroke-dasharray:4 15;animation:signal 16s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}@keyframes signal{to{stroke-dashoffset:-380}}@keyframes pulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.signal,.pulse{animation:none}}</style><rect width="720" height="370" fill="#0b1420"/><path d="M0 24 V0 H696 L720 24 V370 H24 L0 346 Z" fill="none" stroke="#314652" stroke-width="2" /><text x="34" y="39" fill="#c9fc78" font-size="15" font-family="ui-monospace,Consolas,monospace" letter-spacing="1.5" >01 / SPARE HARDWARE. ANOTHER LIFE.</text><text x="34" y="106" fill="#ecf2ec" font-size="53" font-weight="650" letter-spacing="-1.5">anyDeploy</text><text x="36" y="149" fill="#a5b6bf" font-size="24" >Self-hosted deployment</text><path d="M104 235 H610" fill="none" stroke="#314652" stroke-width="2" /><path d="M104 235 H610" fill="none" stroke="#c9fc78" stroke-width="2" class="signal"/><rect x="53" y="208" width="102" height="54" rx="3" fill="#112330" stroke="#314652" /><text x="104" y="241" fill="#ecf2ec" font-size="14" font-family="ui-monospace,Consolas,monospace" letter-spacing="1.5" text-anchor="middle">REPO</text><rect x="306" y="208" width="102" height="54" rx="3" fill="#112330" stroke="#314652" /><text x="357" y="241" fill="#ecf2ec" font-size="14" font-family="ui-monospace,Consolas,monospace" letter-spacing="1.5" text-anchor="middle">DEPLOY</text><rect x="559" y="208" width="102" height="54" rx="3" fill="#112330" stroke="#314652" /><text x="610" y="241" fill="#c9fc78" font-size="13" font-family="ui-monospace,Consolas,monospace" letter-spacing="1.5" text-anchor="middle">HARDWARE</text><path d="M610 274 V296 H104 V274" fill