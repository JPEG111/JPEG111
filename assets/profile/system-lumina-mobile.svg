<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1100" viewBox="0 0 720 1100" role="img" aria-labelledby="title desc"><title id="title">Lumina. Structured text becomes an editable, printable document.</title><desc id="desc">Original dark artwork for Skandar / JPEG111. Workflow illustrations, not a live application or telemetry.</desc><defs><linearGradient id="border"><stop stop-color="#53617d"/><stop offset=".5" stop-color="#152239"/><stop offset="1" stop-color="#54d9ff" stop-opacity=".55"/></linearGradient><radialGradient id="halo"><stop stop-color="#54d9ff" stop-opacity=".18"/><stop offset="1" stop-color="#54d9ff" stop-opacity="0"/></radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#273950" stroke-opacity=".28"/></pattern><clipPath id="clip"><rect x="2" y="2" width="716" height="1096" rx="28"/></clipPath></defs><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"Cascadia Code",Consolas,monospace}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 36s linear infinite}.reverse{animation-direction:reverse;animation-duration:54s}.signal{stroke-dasharray:8 22;animation:signal 7s linear infinite}.pulse{animation:pulse 3.6s ease-in-out infinite}.delay{animation-delay:1.2s}.scan{animation:scan 7s ease-in-out infinite}.line1{animation:lines 9s ease-in-out infinite}.line2{animation:lines 9s 1s ease-in-out infinite}.line3{animation:lines 9s 2s ease-in-out infinite}.float{animation:float 7s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes signal{to{stroke-dashoffset:-360}}@keyframes pulse{50%{opacity:.28}}@keyframes scan{0%,100%{transform:translateX(-55px);opacity:.2}50%{transform:translateX(55px);opacity:.8}}@keyframes lines{0%,100%{opacity:.3}25%,75%{opacity:1}}@keyframes float{50%{transform:translateY(-10px)}}@media(prefers-reduced-motion:reduce){.orbit,.signal,.pulse,.scan,.line1,.line2,.line3,.float{animation:none!important}}</style><g clip-path="url(#clip)"><rect width="720" height="1100" fill="#05070d"/><rect width="720" height="1100" fill="url(#grid)"/><text x="42" y="51" font-size="19" fill="#54d9ff" class="mono" letter-spacing="1.4" >05 / LOCAL BUILD / LAB</text><text x="678" y="51" font-size="19" fill="#9baac1" class="mono" letter-spacing="1.4" text-anchor="end">JPEG111</text><path d="M42 78H678" fill="none" stroke="#243143" stroke-width="2" /><text x="42" y="180" font-size="104" fill="#c5ff5c" font-weight="800" letter-spacing="-4">Lumina</text><text x="46" y="248" font-size="31" fill="#9baac1" >Structured text becomes an</text><text x="46" y="293" font-size="31" fill="#9baac1" >editable, printable document.</text><text x="48" y="401" font-size="19" fill="#c5ff5c" class="mono" letter-spacing="1.4" >MODEL</text><text x="48" y="437" font-size="27" fill="#f3f7ff" >One typed ResumeData object</text><text x="48" y="480" font-size="19" fill="#c5ff5c" class="mono" letter-spacing="1.4" >EDIT</text><text x="48" y="516" font-size="27" fill="#f3f7ff" >Template-scoped layout overrides</text><text x="48" y="559" font-size="19" fill="#c5ff5c" class="mono" letter-spacing="1.4" >PRINT</text><text x="48" y="595" font-size="27" fill="#f3f7ff" >A4 pagination / browser print</text><rect x="42" y="682" width="636" height="340" rx="20" fill="#09111e" stroke="#243143"/><rect x="261" y="707" width="198" height="275" rx="5" fill="#152235" stroke="#9baac1"/><rect x="282" y="736" width="156" height="53" rx="2" fill="#263e43" stroke="#c5ff5c"/><text x="293" y="769" font-size="17" fill="#c5ff5c" class="mono">A4 / LAYOUT</text><path d="M284 818h150" fill="none" stroke="#6e819d" stroke-width="2" /><path d="M284 846h110" fill="none" stroke="#6e819d" stroke-width="2" /><path d="M284 874h150" fill="none" stroke="#6e819d" stroke-width="2" /><path d="M284 902h110" fill="none" stroke="#6e819d" stroke-width="2" /><path d="M284 930h150" fill="none" stroke="#6e819d" stroke-width="2" /><g class="float"><rect x="226" y="832" width="264" height="73" rx="0" fill="#152b28" stroke="#c5ff5c"/><circle cx="226" cy="832" r="5" fill="#c5ff5c" /><circle cx="490" cy="905" r="5" fill="#c5ff5c" /></g><text x="62" y="1005" font-size="19" fill="#c5ff5c" class="mono" letter-spacing="1.4" >DATA / TEMPLATE / POINTER / PRINT</text><path d="M42 1058H678" fill="none" stroke="#243143" stroke-width="2" /><text x="42" y="1085" font-size="17" fill="#9baac1" class="mono" letter-spacing="1.4" >ARCHITECTURE STUDY / IMPLEMENTED SOURCE</text></g><rect x="1" y="1" width="718" height="1098" rx="28" fill="none" stroke="url(#border)" stroke-width="2"/></svg>
