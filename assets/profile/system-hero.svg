<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">Skandar / JPEG111. Infrastructure, local AI and visual software.</title><desc id="desc">Original dark artwork for Skandar / JPEG111. Workflow illustrations, not a live application or telemetry.</desc><defs><linearGradient id="border"><stop stop-color="#53617d"/><stop offset=".5" stop-color="#152239"/><stop offset="1" stop-color="#54d9ff" stop-opacity=".55"/></linearGradient><radialGradient id="halo"><stop stop-color="#54d9ff" stop-opacity=".18"/><stop offset="1" stop-color="#54d9ff" stop-opacity="0"/></radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#273950" stroke-opacity=".28"/></pattern><clipPath id="clip"><rect x="2" y="2" width="1436" height="816" rx="28"/></clipPath></defs><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"Cascadia Code",Consolas,monospace}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 36s linear infinite}.reverse{animation-direction:reverse;animation-duration:54s}.signal{stroke-dasharray:8 22;animation:signal 7s linear infinite}.pulse{animation:pulse 3.6s ease-in-out infinite}.delay{animation-delay:1.2s}.scan{animation:scan 7s ease-in-out infinite}.line1{animation:lines 9s ease-in-out infinite}.line2{animation:lines 9s 1s ease-in-out infinite}.line3{animation:lines 9s 2s ease-in-out infinite}.float{animation:float 7s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes signal{to{stroke-dashoffset:-360}}@keyframes pulse{50%{opacity:.28}}@keyframes scan{0%,100%{transform:translateX(-55px);opacity:.2}50%{transform:translateX(55px);opacity:.8}}@keyframes lines{0%,100%{opacity:.3}25%,75%{opacity:1}}@keyframes float{50%{transform:translateY(-10px)}}@media(prefers-reduced-motion:reduce){.orbit,.signal,.pulse,.scan,.line1,.line2,.line3,.float{animation:none!important}}</style><g clip-path="url(#clip)"><rect width="1440" height="820" fill="#05070d"/><rect width="1440" height="820" fill="url(#grid)"/><text x="42" y="51" font-size="19" fill="#54d9ff" class="mono" letter-spacing="1.4" >00 / SKANDAR / SOFTWARE SYSTEMS</text><text x="1398" y="51" font-size="19" fill="#9baac1" class="mono" letter-spacing="1.4" text-anchor="end">JPEG111</text><path d="M42 78H1398" fill="none" stroke="#243143" stroke-width="2" /><text x="42" y="248" font-size="118" fill="#f3f7ff" font-weight="850" letter-spacing="-3">FOLLOW THE</text><text x="42" y="400" font-size="105" fill="#c5ff5c" font-weight="850" letter-spacing="-3">CONNECTIONS.</text><text x="46" y="476" font-size="34" fill="#9baac1" >Infrastructure. Local AI. Visual tools.</text><text x="46" y="526" font-size="34" fill="#9baac1" >Built across the whole system.</text><circle cx="1125" cy="350" r="260" fill="url(#halo)"/><g class="orbit"><circle cx="1125" cy="350" r="190" fill="none" stroke="#54d9ff" stroke-opacity=".55" stroke-dasharray="2 15"/><circle cx="1125" cy="160" r="6" fill="#54d9ff" /></g><g class="orbit reverse"><ellipse cx="1125" cy="350" rx="154" ry="154" fill="none" stroke="#c5ff5c" stroke-opacity=".35" stroke-dasharray="55 25 3 25"/><circle cx="1279" cy="350" r="5" fill="#c5ff5c" /></g><circle cx="1125" cy="350" r="115" fill="#0c1624" stroke="#243143"/><text x="1125" y="348" font-size="31" fill="#f3f7ff" text-anchor="middle" font-weight="750">BUILD</text><text x="1125" y="384" font-size="21" fill="#c5ff5c" class="mono" letter-spacing="1.4" text-anchor="middle">→ RUN</text><rect x="1068" y="140" width="114" height="40" rx="8" fill="#0b1220" stroke="#243143"/><text x="1125" y="167" font-size="16" fill="#54d9ff" class="mono" letter-spacing="1.4" text-anchor="middle">REPO</text><rect x="1258" y="330" width="114" height="40" rx="8" fill="#0b1220" stroke="#243143"/><text x="1315" y="357" font-size="16" fill="#54d9ff" class="mono" letter-spacing="1.4" text-anchor="middle">DEVICE</text><rect x="1068" y="520" width="114" height="40" rx="8" fill="#0b1220" stroke="#243143"/><text x="1125" y="547" font-size="16" fill="#54d9ff" class="mono" letter-spacing="1.4" text-anchor="middle">RUNTIME</text><rect x="878" y="330" width="114" height="40" rx="8" fill="#0b1220" stroke="#243143"/><text x="935" y="357" font-size="16" fill="#54d9ff" class="mono" letter-spacing="1.4" text-anchor="middle">ROUTE</text><rect x="46" y="653" width="302" height="42" rx="21" fill="#101823" stroke="#c5ff5c"/><text x="197" y="681" font-size="17" fill="#c5ff5c" class="mono" letter-spacing="1.4" text-anchor="middle">3 RELEASED APPS</text><rect x="370" y="653" width="300" height="42" rx="21" fill="#101823" stroke="#54d9ff"/><text x="520" y="681" font-size="17" fill="#54d9ff" class="mono" letter-spacing="1.4" text-anchor="middle">VOICE + VISION</text><rect x="692" y="653" width="260" height="42" rx="21" fill="#101823" stroke="#9780ff"/><text x="822" y="681" font-size="17" fill="#9780ff" class="mono" letter-spacing="1.4" text-anchor="middle">VISUAL SYSTEMS</text><path d="M42 766H1398" fill="none" stroke="#243143" stroke-width="2" /><text x="42" y="796" font-size="19" fill="#9baac1" class="mono" letter-spacing="1.4" >WINDOWS / LINUX / YOUR HARDWARE</text><text x="1398" y="796" font-size="19" fill="#c5ff5c" class="mono" letter-spacing="1.4" text-anchor="end">EXPLORE ↓</text></g><rect x="1" y="1" width="1438" height="818" rx="28" fill="none" stroke="url(#border)" stroke-width="2"/></svg>
