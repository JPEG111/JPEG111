<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Lumina. Structured text becomes an editable, printable document.</title><desc id="desc">Original dark artwork for Skandar / JPEG111. Workflow illustrations, not a live application or telemetry.</desc><defs><linearGradient id="border"><stop stop-color="#53617d"/><stop offset=".5" stop-color="#152239"/><stop offset="1" stop-color="#54d9ff" stop-opacity=".55"/></linearGradient><radialGradient id="halo"><stop stop-color="#54d9ff" stop-opacity=".18"/><stop offset="1" stop-color="#54d9ff" stop-opacity="0"/></radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#273950" stroke-opacity=".28"/></pattern><clipPath id="clip"><rect x="2" y="2" width="1436" height="756" rx="28"/></clipPath></defs><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"Cascadia Code",Consolas,monospace}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 36s linear infinite}.reverse{animation-direction:reverse;animation-duration:54s}.signal{stroke-dasharray:8 22;animation:signal 7s linear infinite}.pulse{animation:pulse 3.6s ease-in-out infinite}.delay{animation-delay:1.2s}.scan{animation:scan 7s ease-in-out infinite}.line1{animation:lines 9s ease-in-out infinite}.line2{animation:lines 9s 1s ease-in-out infinite}.line3{animation:lines 9s 2s ease-in-out infinite}.float{animation:float 7s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes signal{to{stroke-dashoffset:-360}}@keyframes pulse{50%{opacity:.28}}@keyframes scan{0%,100%{transform:translateX(-55px);opacity:.2}50%{transform:translateX(55px);opacity:.8}}@keyframes lines{0%,100%{opacity:.3}25%,75%{opacity:1}}@keyframes float{50%{transform:translateY(-10px)}}@media(prefers-reduced-motion:reduce){.orbit,.signal,.pulse,.scan,.line1,.line2,.line3,.float{animation:none!important}}</style><g clip-path="url(#clip)"><rect width="1440" height="760" fill="#05070d"/><rect width="1440" height="760" fill="url(#grid)"/><text x="42" y="51" font-size="19" fill="#54d9ff" class="mono" letter-spacing="1.4" >05 / LOCAL BUILD / LAB</text><text x="1398" y="51" font-size="19" fill="#9baac1" class="mono" letter-spacing="1.4" text-anchor="end">JPEG111</text><path d="M42 78H1398" fill="none" stroke="#243143" stroke-width="2" /><text x="42" y="222" font-size="136" fill="#c5ff5c" font-weight="800" letter-spacing="-4">Lumina</text><text x="46" y="300" font-size="34" fill="#9baac1" >Structured text becomes an</text><text x="46" y="345" font-size="34" fill="#9baac1" >editable, printable document.</text><text x="48" y="433" font-size="19" fill="#c5ff5c" class="mono" letter-spacing="1.4" >MODEL</text><text x="48" y="469" font-size="29" fill="#f3f7ff" >One typed ResumeData object</text><text x="48" y="512" font-size="19" fill="#c5ff5c" class="mono" letter-spacing="1.4" >EDIT</text><text x="48" y="548" font-size="29" fill="#f3f7ff" >Template-scoped layout overrides</text><text x="48" y="591" font-size="19" fill="#c5ff5c" class="mono" letter-spacing="1.4" >PRINT</text><text x="48" y="627" font-size="29" fill="#f3f7ff" >A4 pagination / browser print</text><rect x="850" y="179" width="540" height="430" rx="20" fill="#09111e" stroke="#243143"/><rect x="1021" y="204" width="198" height="360" rx="5" fill="#152235" stroke="#9baac1"/><rect x="1042" y="233" width="156" height="53" rx="2" fill="#263e43" stroke="#c5ff5c"/><text x="1053" y="266" font-size="17" fill="#c5ff5c" class="mono">A4 / LAYOUT</text><path d="M1044 315h150" fill="none" stroke="#6e819d" stroke-width="2" /><path d="M1044 343h110" fill="none" stroke="#6e819d" stroke-width="2" /><path d="M1044 371h150" fill="none" stroke="#6e819d" stroke-width="2" /><path d="M1044 399h110" fill="none" stroke="#6e819d" stroke-width="2" /><path d="M1044 427h150" fill="none" stroke="#6e819d" stroke-width="2" /><g class="float"><rect x="986" y="329" width="264" height="73" rx="0" fill="#152b28" stroke="#c5ff5c"/><circle cx="986" cy="329" r="5" fill="#c5ff5c" /><circle cx="1250" cy="402" r="5" fill="#c5ff5c" /></g><text x="870" y="592" font-size="18" fill="#c5ff5c" class="mono" letter-spacing="1.4" >DATA / TEMPLATE / POINTER / PRINT</text><path d="M42 718H1398" fill="none" stroke="#243143" stroke-width="2" /><text x="42" y="745" font-size="18" fill="#9baac1" class="mono" letter-spacing="1.4" >ARCHITECTURE STUDY / IMPLEMENTED SOURCE</text></g><rect x="1" y="1" width="1438" height="758" rx="28" fill="none" stroke="url(#border)" stroke-width="2"/></svg>
