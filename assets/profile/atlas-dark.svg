<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="554" viewBox="0 0 1280 554" role="img" aria-labelledby="t d"><title id="t">A map of my recurring interests and projects.</title><desc id="d">Original artwork for JPEG111's GitHub README. Moving signals are decorative.</desc><style>text{font-family:'Segoe UI',Arial,sans-serif}.signal{stroke-dasharray:4 15;animation:signal 16s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}@keyframes signal{to{stroke-dashoffset:-380}}@keyframes pulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.signal,.pulse{animation:none}}</style><rect width="1280" height="554" fill="#0b1420"/><path d="M0 24 V0 H1256 L1280 24 V554 H24 L0 530 Z" fill="none" stroke="#314652" stroke-width="2" /><text x="38" y="42" fill="#c9fc78" font-size="17" font-family="ui-monospace,Consolas,monospace" letter-spacing="1.5" >THE CONNECTIONS I KEEP COMING BACK TO</text><path d="M640 245 H532 V140 H370" fill="none" stroke="#314652" stroke-width="2" /><circle cx="300" cy="140" r="46" fill="#112330" /><circle cx="300" cy="140" r="46" fill="none" stroke="#83bdd1" stroke-dasharray="2 10"/><text x="300" y="150" fill="#c9fc78" font-size="27" text-anchor="middle">01</text><text x="300" y="223" fill="#c9fc78" font-size="15" font-family="ui-monospace,Consolas,monospace" letter-spacing="1.5" text-anchor="middle">OWN THE HARDWARE</text><text x="300" y="254" fill="#a5b6bf" font-size="21" text-anchor="middle">anyDeploy</text><path d="M640 245 H748 V140 H895" fill="none" stroke="#314652" stroke-width="2" /><circle cx="965" cy="140" r="46" fill="#112330" /><circle cx="965" cy="140" r="46" fill="none" stroke="#83bdd1" stroke-dasharray="2 10"/><text x="965" y="150" fill="#c9fc78" font-size="27" text-anchor="middle">02</text><text x="965" y="223" fill="#c9fc78" font-size="15" font-family="ui-monospace,Consolas,monospace" letter-spacing="1.5" text-anchor="middle">RETAIN THE DECISIONS</text><text x="965" y="254" fill="#a5b6bf" font-size="21" text-anchor="middle">AI tools / memory workflows</text><path d="M640 245 H532 V354 H370" fill="none" stroke="#314652" stroke-width="2" /><circle cx="300" cy="354" r="46" fill="#112330" /><circle cx="300" cy="354" r="46" fill="none" stroke="#83bdd1" stroke-dasharray="2 10"/><text x="300" y="364" fill="#c9fc78" font-size="27" text-anchor="middle">03</text><text x="300" y="437" fill="#c9fc78" font-size="15" font-family="ui-monospace,Consolas,monospace" letter-spacing="1.5" text-anchor="middle">SURVIVE REAL STATE</text><text x="300" y="468" fill="#a5b6bf" font-size="21" text-anchor="middle">Orbs</text><path d="M640 245 H748 V354 H895" fill="none" stroke="#314652" stroke-width="2" /><circle cx="965" cy="354" r="46" fill="#112330" /><circle cx="965" cy="354" r="46" fill="none" stroke="#83bdd1" stroke-dasharray="2 10"/><text x="965" y="364" fill="#c9fc78" font-size="27" text-anchor="middle">04</text><text x="965" y="437" fill="#c9fc78" font-size="15" font-family="ui-monospace,Consolas,monospace" letter-spacing="1.5" text-anchor="middle">ORGANIZE THE EVIDENCE</text><text x="965" y="468" fill="#a5b6bf" font-size="21" text-anchor="middle">Research archive / knowledge maps</text><circle cx="640" cy="245" r="67" fill="#0b1420" stroke="#314652"/><text x="640" y="258" fill="#ecf2ec" font-size="30" text-anchor="middle">What if?</text><path d="M573 245 A67 67 0 1 1 707 245" fill="none" stroke="#c9fc78" stroke-width="2" class="signal"/><text x="38" y="523" fill="#a5b6bf" font-size="15" font-family="ui-monospace,Consolas,monospace" letter-spacing="1.5" >LINES CONNECT INTERESTS, NOT SOFTWARE DEPENDENCIES.</text></svg>
