<svg xmlns="http://www.w3.org/2000/svg" width="720" height="685" viewBox="0 0 720 685" role="img" aria-labelledby="t d"><title id="t">Four recurring interests: self-hosting, memory, desktop state and creative artifacts.</title><desc id="d">Original artwork for JPEG111's GitHub README. Moving signals are decorative.</desc><style>text{font-family:'Segoe UI',Arial,sans-serif}.signal{stroke-dasharray:4 15;animation:signal 16s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}@keyframes signal{to{stroke-dashoffset:-380}}@keyframes pulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.signal,.pulse{animation:none}}</style><rect width="720" height="685" fill="#0b1420"/><path d="M0 24 V0 H696 L720 24 V685 H24 L0 661 Z" fill="none" stroke="#314652" stroke-width="2" /><text x="34" y="45" fill="#c9fc78" font-size="19" font-family="ui-monospace,Consolas,monospace" letter-spacing="1.5" >THE THREAD THROUGH THE PROJECTS</text><path d="M57 107 V223" fill="none" stroke="#314652" stroke-width="2" /><circle cx="57" cy="107" r="6" fill="#c9fc78" /><text x="94" y="111" fill="#c9fc78" font-size="18" font-family="ui-monospace,Consolas,monospace" letter-spacing="1.5" >01 / OWN THE HARDWARE</text><text x="94" y="154" fill="#ecf2ec" font-size="28" >anyDeploy</text><path d="M57 234 V350" fill="none" stroke="#314652" stroke-width="2" /><circle cx="57" cy="234" r="6" fill="#c9fc78" /><text x="94" y="238" fill="#c9fc78" font-size="18" font-family="ui-monospace,Consolas,monospace" letter-spacing="1.5" >02 / RETAIN THE DECISIONS</text><text x="94" y="281" fill="#ecf2ec" font-size="28" >OmniAgent / Strategy OS</text><path d="M57 361 V477" fill="none" stroke="#314652" stroke-width="2" /><circle cx="57" cy="361" r="6" fill="#c9fc78" /><text x="94" y="365" fill="#c9fc78" font-size="18" font-family="ui-monospace,Consolas,monospace" letter-spacing="1.5" >03 / SURVIVE REAL STATE</text><text x="94" y="408" fill="#ecf2ec" font-size="28" >Orbs</text><path d="M57 488 V604" fill="none" str