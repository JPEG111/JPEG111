<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1180" viewBox="0 0 720 1180" role="img" aria-labelledby="title desc"><title id="title">Orbs. Desktop automation built around changing state.</title><desc id="desc">Original dark artwork for Skandar / JPEG111. Workflow illustrations, not a live application or telemetry.</desc><defs><linearGradient id="border"><stop stop-color="#53617d"/><stop offset=".5" stop-color="#152239"/><stop offset="1" stop-color="#54d9ff" stop-opacity=".55"/></linearGradient><radialGradient id="halo"><stop stop-color="#54d9ff" stop-opacity=".18"/><stop offset="1" stop-color="#54d9ff" stop-opacity="0"/></radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#273950" stroke-opacity=".28"/></pattern><clipPath id="clip"><rect x="2" y="2" width="716" height="1176" rx="28"/></clipPath></defs><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"Cascadia Code",Consolas,monospace}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 36s linear infinite}.reverse{animation-direction:reverse;animation-duration:54s}.signal{stroke-dasharray:8 22;animation:signal 7s linear infinite}.pulse{animation:pulse 3.6s ease-in-out infinite}.delay{animation-delay:1.2s}.scan{animation:scan 7s ease-in-out infinite}.line1{animation:lines 9s ease-in-out infinite}.line2{animation:lines 9s 1s ease-in-out infinite}.line3{animation:lines 9s 2s ease-in-out infinite}.float{animation:float 7s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes signal{to{stroke-dashoffset:-360}}@keyframes pulse{50%{opacity:.28}}@keyframes scan{0%,100%{transform:translateX(-55px);opacity:.2}50%{transform:translateX(55px);opacity:.8}}@keyframes lines{0%,100%{opacity:.3}25%,75%{opacity:1}}@keyframes float{50%{transform:translateY(-10px)}}@media(prefers-reduced-motion:reduce){.orbit,.signal,.pulse,.scan,.line1,.line2,.line3,.float{animation:none!important}}</style><g clip-path="url(#clip)"><rect width="720" height="1180" fill="#05070d"/><rect width="720" height="1180" fill="url(#grid)"/><text x="42" y="51" font-size="19" fill="#54d9ff" class="mono" letter-spacing="1.4" >02 / RELEASED SOFTWARE</text><text x="678" y="51" font-size="19" fill="#9baac1" class="mono" letter-spacing="1.4" text-anchor="end">JPEG111</text><path d="M42 78H678" fill="none" stroke="#243143" stroke-width="2" /><text x="42" y="180" font-size="104" fill="#54d9ff" font-weight="800" letter-spacing="-4">Orbs</text><text x="46" y="240" font-size="31" fill="#9baac1" >Desktop automation built</text><text x="46" y="284" font-size="31" fill="#9baac1" >around changing state.</text><text x="48" y="344" font-size="19" fill="#54d9ff" class="mono" letter-spacing="1.4" >OBSERVE</text><text x="48" y="380" font-size="28" fill="#f3f7ff" >Client state / quest queue</text><text x="48" y="422" font-size="19" fill="#54d9ff" class="mono" letter-spacing="1.4" >RECOVER</text><text x="48" y="458" font-size="28" fill="#f3f7ff" >Bounded retries / deadlines</text><text x="48" y="500" font-size="19" fill="#54d9ff" class="mono" letter-spacing="1.4" >PRESERVE</text><text x="48" y="536" font-size="28" fill="#f3f7ff" >Queues / preferences / updates</text><rect x="150" y="610" width="420" height="62" rx="12" fill="#101a29" stroke="#243143"/><circle cx="174" cy="641" r="4" fill="#54d9ff" class="pulse "/><text x="198" y="649" font-size="23" fill="#f3f7ff" class="mono" letter-spacing="1.4" >OBSERVE CLIENT</text><path d="M360 672V699" fill="none" stroke="#54d9ff" stroke-width="2" class="signal"/><rect x="150" y="699" width="420" height="62" rx="12" fill="#101a29" stroke="#243143"/><circle cx="174" cy="730" r="4" fill="#54d9ff" class="pulse delay"/><text x="198" y="738" font-size="23" fill="#f3f7ff" class="mono" letter-spacing="1.4" >WAIT / RECOVER</text><path d="M360 761V788" fill="none" stroke="#54d9ff" stroke-width="2" class="signal"/><rect x="150" y="788" width="420" height="62" rx="12" fill="#101a29" stroke="#243143"/><circle cx="174" cy="819" r="4" fill="#54d9ff" class="pulse "/><text x="198" y="827" font-size="23" fill="#f3f7ff" class="mono" letter-spacing="1.4" >ACT / VERIFY</text><path d="M360 850V877" fill="none" stroke="#54d9ff" stroke-width="2" class="signal"/><rect x="150" y="877" width="420" height="62" rx="12" fill="#101a29" stroke="#54d9ff"/><circle cx="174" cy="908" r="4" fill="#54d9ff" class="pulse delay"/><text x="198" y="916" font-size="23" fill="#54d9ff" class="mono" letter-spacing="1.4" >MANAGE QUEUE</text><rect x="42" y="1001" width="305" height="42" rx="21" fill="#101823" stroke="#54d9ff"/><text x="194.5" y="1029" font-size="17" fill="#54d9ff" class="mono" letter-spacing="1.4" text-anchor="middle">WINDOWS 10 / 11</text><rect x="372" y="1001" width="305" height="42" rx="21" fill="#101823" stroke="#9baac1"/><text x="524.5" y="1029" font-size="17" fill="#9baac1" class="mono" letter-spacing="1.4" text-anchor="middle">EN / AR</text><rect x="42" y="1057" width="305" height="42" rx="21" fill="#101823" stroke="#54d9ff"/><text x="194.5" y="1085" font-size="17" fill="#54d9ff" class="mono" letter-spacing="1.4" text-anchor="middle">SYSTEM TRAY</text><rect x="372" y="1057" width="305" height="42" rx="21" fill="#101823" stroke="#9baac1"/><text x="524.5" y="1085" font-size="17" fill="#9baac1" class="mono" letter-spacing="1.4" text-anchor="middle">AUTO-UPDATES</text><text x="678" y="1150" font-size="17" fill="#54d9ff" class="mono" letter-spacing="1.4" text-anchor="end">OPEN PROJECT / RELEASES ↗</text></g><rect x="1" y="1" width="718" height="1178" rx="28" fill="none" stroke="url(#border)" stroke-width="2"/></svg>
