<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="240" viewBox="0 0 1440 240" role="img" aria-labelledby="title desc"><title id="title">AFTER THE BUILD. GITHUB ACTIVITY / PAC-MAN</title><desc id="desc">Original dark artwork for Skandar / JPEG111. Workflow illustrations, not a live application or telemetry.</desc><defs><linearGradient id="border"><stop stop-color="#53617d"/><stop offset=".5" stop-color="#152239"/><stop offset="1" stop-color="#54d9ff" stop-opacity=".55"/></linearGradient><radialGradient id="halo"><stop stop-color="#54d9ff" stop-opacity=".18"/><stop offset="1" stop-color="#54d9ff" stop-opacity="0"/></radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#273950" stroke-opacity=".28"/></pattern><clipPath id="clip"><rect x="2" y="2" width="1436" height="236" rx="28"/></clipPath></defs><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"Cascadia Code",Consolas,monospace}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 36s linear infinite}.reverse{animation-direction:reverse;animation-duration:54s}.signal{stroke-dasharray:8 22;animation:signal 7s linear infinite}.pulse{animation:pulse 3.6s ease-in-out infinite}.delay{animation-delay:1.2s}.scan{animation:scan 7s ease-in-out infinite}.line1{animation:lines 9s ease-in-out infinite}.line2{animation:lines 9s 1s ease-in-out infinite}.line3{animation:lines 9s 2s ease-in-out infinite}.float{animation:float 7s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes signal{to{stroke-dashoffset:-360}}@keyframes pulse{50%{opacity:.28}}@keyframes scan{0%,100%{transform:translateX(-55px);opacity:.2}50%{transform:translateX(55px);opacity:.8}}@keyframes lines{0%,100%{opacity:.3}25%,75%{opacity:1}}@keyframes float{50%{transform:translateY(-10px)}}@media(prefers-reduced-motion:reduce){.orbit,.signal,.pulse,.scan,.line1,.line2,.line3,.float{animation:none!important}}</style><g clip-path="url(#clip)"><rect width="1440" height="240" fill="#05070d"/><rect width="1440" height="240" fill="url(#grid)"/><text x="42" y="48" font-size="19" fill="#9780ff" class="mono" letter-spacing="1.4" >09 / JPEG111</text><text x="42" y="145" font-size="76" fill="#f3f7ff" font-weight="800" letter-spacing="-2">AFTER THE BUILD</text><text x="46" y="196" font-size="24" fill="#9780ff" class="mono" letter-spacing="1.4" >GITHUB ACTIVITY / PAC-MAN</text><path d="M1130 40V206M1210 40V206" fill="none" stroke="#243143" stroke-width="2" /><g class="scan"><path d="M1130 55V190" fill="none" stroke="#9780ff" stroke-width="4"/></g></g><rect x="1" y="1" width="1438" height="238" rx="28" fill="none" stroke="url(#border)" stroke-width="2"/></svg>
