<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1100" viewBox="0 0 720 1100" role="img" aria-labelledby="title desc"><title id="title">JARVIS. A voice assistant with tools, vision and a shared GPU budget.</title><desc id="desc">Release and activity values are dated public GitHub snapshots. Animated project scenes are labelled example walkthroughs with coordinated input, processing and output states; they are not live application telemetry.</desc><defs><linearGradient id="border"><stop stop-color="#53617d"/><stop offset=".5" stop-color="#152239"/><stop offset="1" stop-color="#54d9ff" stop-opacity=".55"/></linearGradient><radialGradient id="halo"><stop stop-color="#54d9ff" stop-opacity=".18"/><stop offset="1" stop-color="#54d9ff" stop-opacity="0"/></radialGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#314d69"/><stop offset=".5" stop-color="#182b40"/><stop offset="1" stop-color="#0c1523"/></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#19394a" stop-opacity=".8"/><stop offset="1" stop-color="#0a1728" stop-opacity=".95"/></linearGradient><radialGradient id="board-glow"><stop stop-color="#54d9ff" stop-opacity=".13"/><stop offset="1" stop-color="#54d9ff" stop-opacity="0"/></radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#273950" stroke-opacity=".28"/></pattern><clipPath id="clip"><rect x="2" y="2" width="716" height="1096" rx="28"/></clipPath></defs><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"Cascadia Code",Consolas,monospace}.state-0{animation:s0 16s steps(1,end) infinite}@keyframes s0{0%{opacity:1}0%{opacity:1}24.99%{opacity:1}25%,100%{opacity:0}}.state-1{animation:s1 16s steps(1,end) infinite}@keyframes s1{0%,24.99%{opacity:0}25%{opacity:1}49.99%{opacity:1}50%,100%{opacity:0}}.state-2{animation:s2 16s steps(1,end) infinite}@keyframes s2{0%,49.99%{opacity:0}50%{opacity:1}74.99%{opacity:1}75%,100%{opacity:0}}.state-3{animation:s3 16s steps(1,end) infinite}@keyframes s3{0%,74.99%{opacity:0}75%{opacity:1}99.99%{opacity:1}100%,100%{opacity:0}}.state{opacity:0}.state.final{opacity:1}@media(prefers-reduced-motion:reduce){.state{animation:none!important;opacity:0!important}.state.final{opacity:1!important}}</style><g clip-path="url(#clip)"><rect width="720" height="1100" fill="#05070d"/><rect width="720" height="1100" fill="url(#grid)"/><text x="42" y="51" font-size="19" fill="#54d9ff" class="mono" letter-spacing="1.4" >04 / LOCAL BUILD / LAB</text><text x="678" y="51" font-size="19" fill="#9baac1" class="mono" letter-spacing="1.4" text-anchor="end">JPEG111</text><path d="M42 78H678" fill="none" stroke="#243143" stroke-width="2" /><text x="42" y="180" font-size="104" fill="#54d9ff" font-weight="800" letter-spacing="-4">JARVIS</text><text x="46" y="248" font-size="31" fill="#9baac1" >A voice assistant with tools,</text><text x="46" y="293" font-size="31" fill="#9baac1" >vision and a shared GPU budget.</text><text x="48" y="401" font-size="19" fill="#54d9ff" class="mono" letter-spacing="1.4" >LISTEN</text><text x="48" y="437" font-size="27" fill="#f3f7ff" >Wake word / VAD / Whisper</text><text x="48" y="480" font-size="19" fill="#54d9ff" class="mono" letter-spacing="1.4" >ROUTE</text><text x="48" y="516" font-size="27" fill="#f3f7ff" >LangGraph / local + cloud models</text><text x="48" y="559" font-size="19" fill="#54d9ff" class="mono" letter-spacing="1.4" >SPEAK</text><text x="48" y="595" font-size="27" fill="#f3f7ff" >Sentence chunks / TTS / playback</text><g transform="translate(42 682) scale(1.06 0.7906976744186046)"><g class="state state-0" data-state="0" aria-label="Audio captured"><rect x="12" y="12" width="576" height="355" rx="16" fill="#0b1725" stroke="#263b53"/><text x="32" y="45" font-size="16" fill="#54d9ff" class="mono" letter-spacing=".8" >EXAMPLE / VOICE → TOOL → SPEECH</text><rect x="32" y="72" width="124" height="38" rx="6" fill="#173b