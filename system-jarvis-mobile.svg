</text><rect x="32" y="72" width="124" height="38" rx="6" fill="#0d1b2b" stroke="#263b53"/><text x="94" y="97" font-size="11" fill="#94a8c2" class="mono" letter-spacing=".8" text-anchor="middle">AUDIO BUFFER</text><rect x="170" y="72" width="124" height="38" rx="6" fill="#0d1b2b" stroke="#263b53"/><text x="232" y="97" font-size="11" fill="#94a8c2" class="mono" letter-spacing=".8" text-anchor="middle">TRANSCRIPT</text><rect x="308" y="72" width="124" height="38" rx="6" fill="#173b48" stroke="#54d9ff"/><text x="370" y="97" font-size="11" fill="#54d9ff" class="mono" letter-spacing=".8" text-anchor="middle">TOOL ROUTE</text><rect x="446" y="72" width="124" height="38" rx="6" fill="#0d1b2b" stroke="#263b53"/><text x="508" y="97" font-size="11" fill="#94a8c2" class="mono" letter-spacing=".8" text-anchor="middle">SPEECH QUEUE</text><text x="40" y="167" font-size="17" fill="#54d9ff" class="mono" letter-spacing=".8" >TOOL SELECTED</text><text x="40" y="215" font-size="30" fill="#c5ff5c" class="mono">open_project()</text><text x="40" y="258" font-size="17" fill="#94a8c2" class="mono" letter-spacing=".8" >Tool result becomes answer context.</text><text x="32" y="339" font-size="14" fill="#94a8c2" class="mono" letter-spacing=".8" >CHUNKS PRESERVE ORDER THROUGH THE PIPELINE</text><text x="18" y="405" font-size="16" fill="#54d9ff" class="mono" letter-spacing=".8" >03 / TOOL SELECTED</text></g><g class="state state-3 final" data-state="3" aria-label="Sentence queued for speech"><rect x="12" y="12" width="576" height="355" rx="16" fill="#0b1725" stroke="#263b53"/><text x="32" y="45" font-size="16" fill="#54d9ff" class="mono" letter-spacing=".8" >EXAMPLE / VOICE → TOOL → SPEECH</text><rect x="32" y="72" width="124" height="38" rx="6" fill="#0d1b2b" stroke="#263b53"/><text x="94" y="97" font-size="11" fill="#94a8c2" class="mono" letter-spacing=".8" text-anchor="middle">AUDIO BUFFER</text><rect x="170" y="72" width="124" height="38" rx="6" fill="#0d1b2b" stroke="#263b53"/><text x="232" y="97" font-size="11" fill="#94a8c2" class="mono" letter-spacing=".8" text-anchor="middle">TRANSCRIPT</text><rect x="308" y="72" width="124" height="38" rx="6" fill="#0d1b2b" stroke="#263b53"/><text x="370" y="97" font-size="11" fill="#94a8c2" class="mono" letter-spacing=".8" text-anchor="middle">TOOL ROUTE</text><rect x="446" y="72" width="124" height="38" rx="6" fill="#173b48" stroke="#54d9ff"/><text x="508" y="97" font-size="11" fill="#54d9ff" class="mono" letter-spacing=".8" text-anchor="middle">SPEECH QUEUE</text><rect x="39" y="140" width="518" height="67" rx="8" fill="#17352e" stroke="#c5ff5c"/><text x="58" y="181" font-size="29" fill="#c5ff5c" >“The project is open.”</text><text x="40" y="254" font-size="17" fill="#54d9ff" class="mono" letter-spacing=".8" >SENTENCE READY → TTS → PLAYBACK</text><text x="32" y="339" font-size="14" fill="#94a8c2" class="mono" letter-spacing=".8" >CHUNKS PRESERVE ORDER THROUGH THE PIPELINE</text><text x="18" y="405" font-size="16" fill="#54d9ff" class="mono" letter-spacing=".8" >04 / SENTENCE QUEUED FOR SPEECH</text></g></g><text x="62" y="1052" font-size="16" fill="#54d9ff" class="mono" letter-spacing="1.4" >EXAMPLE / INPUT TO OUTPUT</text><path d="M42 1058H678" fill="none" stroke="#243143" stroke-width="2" /><text x="42" y="1085" font-size="17" fill="#9baac1" class="mono" letter-spacing="1.4" >ARCHITECTURE STUDY / IMPLEMENTED SOURCE</text></g><rect x="1" y="1" width="718" height="1098" rx="28" fill="none" stroke="url(#border)" stroke-width="2"/></svg>
